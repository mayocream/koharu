[workspace]
members = ["crates/*"]
default-members = ["crates/koharu"]
resolver = "3"

[workspace.package]
version = "0.66.10"
edition = "2024"
description = "Manga translation tools"
license = "MIT OR Apache-2.0"
authors = [
    "Mayo Takanashi <mayo@linux.com>",
    "Wangchong Zhou <fffonion@gmail.com>",
]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/mayocream/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false

[workspace.dependencies]
koharu-app = { path = "crates/koharu-app" }
koharu-bindgen = { path = "crates/koharu-bindgen" }
koharu-config = { path = "crates/koharu-config" }
koharu-storage = { path = "crates/koharu-storage" }
koharu-scene = { path = "crates/koharu-scene" }
koharu-diffusion = { path = "crates/koharu-diffusion" }
koharu-diffusion-sys = { path = "crates/koharu-diffusion-sys" }
koharu-llama = { path = "crates/koharu-llama" }
koharu-llama-sys = { path = "crates/koharu-llama-sys" }
koharu-runtime = { path = "crates/koharu-runtime" }
koharu-torch = { path = "crates/koharu-torch" }
koharu-torch-sys = { path = "crates/koharu-torch-sys" }
koharu-agent = { path = "crates/koharu-agent" }
koharu-ml = { path = "crates/koharu-ml" }
koharu-pipeline = { path = "crates/koharu-pipeline" }
koharu-translator = { path = "crates/koharu-translator" }
koharu-psd = { path = "crates/koharu-psd" }
koharu-renderer = { path = "crates/koharu-renderer" }
koharu-canvas = { path = "crates/koharu-canvas" }
koharu-desktop = { path = "crates/koharu-desktop" }
koharu-secrets = { path = "crates/koharu-secrets" }

# external dependencies
alphanumeric-sort = "1.5.8"
arc-swap = "1.7"
image = "0.25"
webp = { version = "0.3.1" }
fast_image_resize = { version = "6.0", features = ["image", "rayon"] }
anyhow = "1.0"
async-trait = "0.1"
imageproc = "0.27"
ab_glyph = "0.2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.25", features = ["derive", "url", "uuid"] }
specta-typescript = "=0.0.12"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
console = "0.16"
open = "5.3"
rfd = "0.17"
thiserror = "2.0"
blake3 = "1.8"
dunce = "1.0.5"
rayon = "1.12"
# disables `esaxx_fast` feature which is conflicting with `ort`
tokenizers = { version = "0.23", features = ["onig"] }
strum = { version = "0.28", features = ["derive"] }
sysinfo = { version = "0.39.6", features = ["system"] }
zip = { version = "8.6", features = ["deflate"] }
dirs = "6.0"
futures = "0.3"
eventsource-stream = "0.2.3"
encoding_rs = "0.8"
enumflags2 = "0.7.12"
reqwest = { version = "0.13", features = ["stream", "json", "form", "blocking", "multipart"] }
secrecy = { version = "0.10", features = ["serde"] }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
toml = "1.1"
url = { version = "2.5", features = ["serde"] }
petgraph = "0.8.3"
imbl = "7.0.1"
hashbrown = "0.17.1"
slotmap = "1.1.1"
smallvec = "1.15.2"
revision = { version = "0.30.0", features = ["uuid"] }
flate2 = "1.0"
tempfile = "3.24"
once_cell = "1.21"
libloading = "0.8.9"
nvml-wrapper = "0.12.1"
minijinja = "2.19"
minijinja-contrib = { version = "2.19", features = ["pycompat"] }
windows = { version = "0.62", features = [
    "Win32",
    "Win32_System",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
skrifa = "0.42"
harfrust = "0.10"
hypher = "0.1.7"
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
icu_properties = "2.2"
icu_segmenter = "2.2"
jieba-rs = "0.10"
fontique = "0.11"
pollster = "0.4"
vello = "0.9"
tauri = { version = "=2.11.5", default-features = false, features = [
    "cef",
    "compression",
    "dbus",
    "dynamic-acl",
    "macos-private-api",
    "specta",
    "x11",
] }
tauri-build = "=2.6.3"
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1423992771e0b57582ca3b06a6adc46ec26aa784" }
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1423992771e0b57582ca3b06a6adc46ec26aa784" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1423992771e0b57582ca3b06a6adc46ec26aa784" }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1423992771e0b57582ca3b06a6adc46ec26aa784" }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1423992771e0b57582ca3b06a6adc46ec26aa784" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
schemars = { version = "1.2", features = ["chrono04", "indexmap2", "uuid1"] }
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
atomicwrites = "0.4"
fs4 = "1"
parking_lot = "0.12"
walkdir = "2.5"
base64 = "0.22"
unicode-bidi = "0.3"
criterion = { version = "0.8", features = ["html_reports"] }
keyring = { version = "4.1", features = ["linux-keyutils-keyring-store"] }
keyring-core = "1.0"
linux-keyutils-keyring-store = "1.0"
llguidance = "1.7.5"
sentry = { version = "0.48", features = ["tracing"] }
fast-glob = "1.0"
tar = "0.4"
toktrie = "1.7.5"
bytes = "1.12"
cmake = "0.1"
bindgen = "0.72"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
libc = "0.2"
memmap2 = "0.9"

[profile.dev]
debug = 1

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.webp]
opt-level = 3

[profile.dev.package.libwebp-sys]
opt-level = 3

[patch.crates-io]
tauri = { git = "https://github.com/mayocream/tauri", rev = "2908dbbbb7ea0c9aaf30a0e33c819a7eba092278" }
tauri-build = { git = "https://github.com/mayocream/tauri", rev = "2908dbbbb7ea0c9aaf30a0e33c819a7eba092278" }
tauri-codegen = { git = "https://github.com/mayocream/tauri", rev = "2908dbbbb7ea0c9aaf30a0e33c819a7eba092278" }
tauri-macros = { git = "https://github.com/mayocream/tauri", rev = "2908dbbbb7ea0c9aaf30a0e33c819a7eba092278" }
tauri-plugin = { git = "https://github.com/mayocream/tauri", rev = "2908dbbbb7ea0c9aaf30a0e33c819a7eba092278" }
tauri-runtime = { git = "https://github.com/mayocream/tauri", rev = "2908dbbbb7ea0c9aaf30a0e33c819a7eba092278" }
tauri-utils = { git = "https://github.com/mayocream/tauri", rev = "2908dbbbb7ea0c9aaf30a0e33c819a7eba092278" }
