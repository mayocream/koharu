name: llama.cpp single-library builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: llama.cpp branch or tag to build
        required: true
        default: b9982
  push:
    branches: ['main']
    paths:
      - '.github/llama.cpp/**'
      - '.github/workflows/llama-cpp.yml'
  pull_request:
    branches: ['main']
    paths:
      - '.github/llama.cpp/**'
      - '.github/workflows/llama-cpp.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REF: ${{ github.event.inputs.ref || 'b9982' }}

jobs:
  build:
    name: ${{ matrix.backend }} / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: CUDA
            platform: Windows x64
            os: windows-2022
            build_dir: build/llama-cuda
            library: llama.dll
            artifact_name: llama-cuda-windows-x64
            artifact_path: build/llama-cuda/bin/llama.dll
          - backend: VULKAN
            platform: Linux x64
            os: ubuntu-24.04
            build_dir: build/llama-vulkan
            library: libllama.so
            artifact_name: llama-vulkan-linux-x64
            artifact_path: build/llama-vulkan/bin/libllama.so
          - backend: METAL
            platform: macOS arm64
            os: macos-latest
            build_dir: build/llama-metal
            library: libllama.dylib
            artifact_name: llama-metal-macos-arm64
            artifact_path: build/llama-metal/bin/libllama.dylib

    runs-on: ${{ matrix.os }}
    env:
      BACKEND: ${{ matrix.backend }}
      BUILD_DIR: ${{ matrix.build_dir }}

    steps:
      - uses: actions/checkout@v7

      - name: Clone llama.cpp
        shell: bash
        run: |
          git clone --depth 1 --branch "$REF" \
            https://github.com/ggml-org/llama.cpp upstream/llama.cpp
          commit=$(git -C upstream/llama.cpp rev-parse HEAD)
          printf 'llama.cpp commit: %s\n' "$commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Install CUDA 13.0
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.0.0'
          method: network
          sub-packages: >-
            ["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas",
            "cublas_dev", "cufft", "cufft_dev", "curand", "curand_dev",
            "nvrtc", "nvrtc_dev"]

      - name: Enable MSVC
        if: matrix.backend == 'CUDA'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: matrix.backend == 'CUDA'
        run: choco install ninja --no-progress -y

      - name: Install Vulkan build dependencies
        if: matrix.backend == 'VULKAN'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            glslc \
            libvulkan-dev \
            ninja-build \
            spirv-headers

      - name: Configure
        shell: bash
        run: |
          generator=()
          backend_args=()

          case "$BACKEND" in
            CUDA)
              generator=(-G Ninja)
              backend_args+=("-DCMAKE_CUDA_ARCHITECTURES=80-real")
              ;;
            VULKAN)
              generator=(-G Ninja)
              ;;
            METAL)
              backend_args+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
              ;;
          esac

          cmake -S .github/llama.cpp -B "$BUILD_DIR" "${generator[@]}" \
            -DLLAMA_CPP_SOURCE_DIR="$PWD/upstream/llama.cpp" \
            -DKOHARU_LLAMA_BACKEND="$BACKEND" \
            -DCMAKE_BUILD_TYPE=Release \
            "${backend_args[@]}"

      - name: Build ${{ matrix.library }}
        shell: bash
        run: cmake --build "$BUILD_DIR" --target llama --config Release --parallel 4

      - name: Upload ${{ matrix.library }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 3
