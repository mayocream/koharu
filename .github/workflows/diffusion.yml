name: Diffusion

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 0'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/diffusion.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve latest release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve latest stable-diffusion.cpp release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/leejet/stable-diffusion.cpp/releases/latest --jq .tag_name)
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: ${{ matrix.backend }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            os: windows-2022
          - backend: cuda
            os: ubuntu-latest
          - backend: hip
            os: windows-2022
          - backend: hip
            os: ubuntu-latest
          - backend: vulkan
            os: ubuntu-latest
          - backend: vulkan
            os: windows-2022
          - backend: metal
            os: macos-latest

    runs-on: ${{ matrix.os }}
    env:
      BACKEND: ${{ matrix.backend }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
          disable_annotations: true

      - name: Check out stable-diffusion.cpp
        uses: actions/checkout@v7
        with:
          repository: leejet/stable-diffusion.cpp
          ref: ${{ needs.source.outputs.tag }}
          path: upstream/stable-diffusion.cpp
          submodules: true

      - name: Install CUDA 13.0
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.0.0'
          method: network
          sub-packages: >-
            ${{ runner.os == 'Linux'
              && '["nvcc", "cudart", "crt", "thrust"]'
              || '["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas", "cublas_dev"]' }}
          non-cuda-sub-packages: >-
            ${{ runner.os == 'Linux' && '["libcublas", "libcublas-dev"]' || '[]' }}

      - name: Set up Python for ROCm
        if: matrix.backend == 'hip'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ROCm 7.14
        if: matrix.backend == 'hip'
        shell: bash
        run: |
          python -m pip install \
            --index-url https://repo.amd.com/rocm/whl-multi-arch/ \
            "rocm[libraries,devel]==7.14.0"
          rocm-sdk init

          rocm_root=$(rocm-sdk path --root)
          if [[ "$RUNNER_OS" == Windows ]]; then
            rocm_root=$(cygpath -w "$rocm_root")
            rocm_bin="$rocm_root\\bin"
            llvm_root="$rocm_root\\lib\\llvm"
            llvm_bin="$llvm_root\\bin"
            device_lib="$llvm_root\\amdgcn\\bitcode"
          else
            rocm_bin="$rocm_root/bin"
            llvm_root="$rocm_root/lib/llvm"
            llvm_bin="$llvm_root/bin"
            device_lib="$llvm_root/amdgcn/bitcode"
          fi
          {
            printf 'ROCM_PATH=%s\n' "$rocm_root"
            printf 'HIP_PATH=%s\n' "$rocm_root"
            printf 'HIP_PLATFORM=amd\n'
            printf 'HIP_DEVICE_LIB_PATH=%s\n' "$device_lib"
            printf 'LLVM_PATH=%s\n' "$llvm_root"
          } >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$rocm_bin" "$llvm_bin" >> "$GITHUB_PATH"

      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Install build dependencies on Linux
        if: runner.os == 'Linux' && matrix.backend != 'vulkan'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build

      - name: Install Vulkan build dependencies on Linux
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            glslc \
            libvulkan-dev \
            ninja-build \
            spirv-headers

      - name: Install Vulkan SDK on Windows
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        shell: bash
        run: |
          version=1.4.328.1
          installer="$(cygpath -u "$RUNNER_TEMP")/VulkanSDK-Installer.exe"
          curl.exe -o "$installer" -L \
            "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          "$installer" --accept-licenses --default-answer --confirm-command install
          printf 'VULKAN_SDK=C:\\VulkanSDK\\%s\n' "$version" >> "$GITHUB_ENV"
          printf 'C:\\VulkanSDK\\%s\\bin\n' "$version" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          generator=()
          backend_args=()
          platform_args=()

          if [[ "$RUNNER_OS" == Windows || "$RUNNER_OS" == Linux ]]; then
            generator=(-G Ninja)
          fi

          if [[ "$RUNNER_OS" == Windows && "$BACKEND" != hip ]]; then
            platform_args+=(
              "-DCMAKE_C_COMPILER=cl.exe"
              "-DCMAKE_CXX_COMPILER=cl.exe"
              "-DCMAKE_CXX_FLAGS=-bigobj"
            )
          fi

          case "$BACKEND" in
            cuda)
              backend_args+=(
                "-DSD_CUDA=ON"
                "-DCMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;90-real;100-real;120"
              )
              ;;
            hip)
              suffix=
              if [[ "$RUNNER_OS" == Windows ]]; then
                suffix=.exe
              fi
              backend_args+=(
                "-DSD_HIPBLAS=ON"
                "-DCMAKE_C_COMPILER=clang$suffix"
                "-DCMAKE_CXX_COMPILER=clang++$suffix"
                "-DGPU_TARGETS=gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201;gfx908;gfx90a"
                "-DAMDGPU_TARGETS=gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201;gfx908;gfx90a"
              )
              ;;
            vulkan)
              backend_args+=("-DSD_VULKAN=ON")
              ;;
            metal)
              backend_args+=(
                "-DSD_METAL=ON"
                "-DCMAKE_OSX_ARCHITECTURES=arm64"
              )
              ;;
          esac

          cmake -S upstream/stable-diffusion.cpp -B build "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache \
            -DCMAKE_HIP_COMPILER_LAUNCHER=sccache \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_SHARED_GGML_LIB=OFF \
            -DSD_BUILD_EXAMPLES=OFF \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_CPU_REPACK=OFF \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_HIP_RCCL=OFF \
            -DGGML_METAL_NDEBUG=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            "${platform_args[@]}" \
            "${backend_args[@]}"

      - name: Build stable-diffusion
        shell: bash
        timeout-minutes: 300
        run: cmake --build build --target stable-diffusion --config Release --parallel

      - name: Package stable-diffusion
        shell: bash
        run: |
          mkdir package
          cp build/bin/*stable-diffusion.* package/
          tar -C package -czf "$RUNNER_OS-$BACKEND.tar.gz" .

      - name: Stop sccache
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Upload stable-diffusion
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ matrix.backend }}
          path: ${{ runner.os }}-${{ matrix.backend }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download stable-diffusion builds
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release
          merge-multiple: true

      - name: Publish stable-diffusion release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: diffusion-${{ needs.source.outputs.tag }}
          target_commitish: ${{ github.event.repository.default_branch }}
          name: Diffusion ${{ needs.source.outputs.tag }}
          body: Koharu runtime dependency.
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: release/*.tar.gz
