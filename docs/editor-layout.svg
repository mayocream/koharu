<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Koharu professional editor layout</title>
  <desc id="desc">A compact Photoshop and Figma-inspired editor shell with a pages navigator, canvas, contextual properties, layer tree, AI inference profile, and system resource telemetry.</desc>

  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#262a2e" />
      <rect width="8" height="8" fill="#30353a" />
      <rect x="8" y="8" width="8" height="8" fill="#30353a" />
    </pattern>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050608" flood-opacity="0.42" />
    </filter>
    <style>
      .ui { font-family: "Segoe UI", Inter, Arial, sans-serif; fill: #d9dde1; }
      .muted { fill: #8b949e; }
      .subtle { fill: #66717c; }
      .label { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
      .small { font-size: 11px; }
      .tiny { font-size: 10px; }
      .panel { fill: #1b1f23; stroke: #30363d; stroke-width: 1; }
      .divider { stroke: #30363d; stroke-width: 1; }
      .icon { fill: none; stroke: #aab4bd; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #64a9ff; }
      .accent-stroke { stroke: #64a9ff; }
    </style>
  </defs>

  <!-- Application frame -->
  <rect width="1440" height="900" fill="#111315" />

  <!-- Title/menu bar -->
  <rect width="1440" height="36" fill="#181b1e" />
  <line x1="0" y1="35.5" x2="1440" y2="35.5" class="divider" />
  <circle cx="18" cy="18" r="7" fill="#64a9ff" />
  <path d="M15 18h6M18 15v6" stroke="#111315" stroke-width="1.5" />
  <text x="34" y="22" class="ui label">Koharu</text>
  <text x="92" y="22" class="ui small muted">File</text>
  <text x="124" y="22" class="ui small muted">Edit</text>
  <text x="158" y="22" class="ui small muted">Image</text>
  <text x="207" y="22" class="ui small muted">Layer</text>
  <text x="250" y="22" class="ui small muted">Process</text>
  <text x="307" y="22" class="ui small muted">View</text>
  <line x1="352" y1="9" x2="352" y2="27" class="divider" />
  <text x="372" y="22" class="ui small">chapter-07.koharu</text>
  <circle cx="499" cy="18" r="3" fill="#69c58a" />
  <text x="510" y="22" class="ui tiny muted">Saved</text>
  <text x="1280" y="22" class="ui small muted">—</text>
  <rect x="1306" y="11" width="12" height="12" fill="none" stroke="#8b949e" />
  <text x="1343" y="22" class="ui small muted">×</text>

  <!-- Context/tool options bar -->
  <rect y="36" width="1440" height="42" fill="#20252a" />
  <line x1="0" y1="77.5" x2="1440" y2="77.5" class="divider" />
  <rect x="12" y="44" width="30" height="26" rx="3" fill="#2c3440" stroke="#64a9ff" />
  <path d="M22 51l8 7-4 1 3 6-2 1-3-6-3 3z" fill="#64a9ff" />
  <text x="53" y="61" class="ui small">Select</text>
  <line x1="113" y1="44" x2="113" y2="70" class="divider" />
  <text x="130" y="60" class="ui tiny muted">X</text>
  <rect x="143" y="46" width="57" height="22" rx="3" fill="#171a1d" stroke="#3b444d" />
  <text x="155" y="61" class="ui small">312</text>
  <text x="211" y="60" class="ui tiny muted">Y</text>
  <rect x="224" y="46" width="57" height="22" rx="3" fill="#171a1d" stroke="#3b444d" />
  <text x="236" y="61" class="ui small">184</text>
  <text x="292" y="60" class="ui tiny muted">W</text>
  <rect x="305" y="46" width="57" height="22" rx="3" fill="#171a1d" stroke="#3b444d" />
  <text x="317" y="61" class="ui small">246</text>
  <text x="373" y="60" class="ui tiny muted">H</text>
  <rect x="386" y="46" width="57" height="22" rx="3" fill="#171a1d" stroke="#3b444d" />
  <text x="398" y="61" class="ui small">92</text>
  <line x1="462" y1="44" x2="462" y2="70" class="divider" />
  <text x="480" y="60" class="ui small muted">Text layer selected</text>
  <rect x="1208" y="45" width="96" height="24" rx="3" fill="#263f5c" stroke="#64a9ff" />
  <text x="1225" y="61" class="ui small">Run AI ▾</text>
  <text x="1002" y="60" text-anchor="end" class="ui tiny muted">Qwen3-VL 8B · Max</text>
  <rect x="1312" y="45" width="112" height="24" rx="3" fill="#293139" stroke="#3b444d" />
  <text x="1324" y="61" class="ui small">✦  Quality ▾</text>

  <!-- Main panels -->
  <rect x="0" y="78" width="194" height="782" class="panel" />
  <rect x="194" y="78" width="930" height="782" fill="#15181b" />
  <rect x="1124" y="78" width="316" height="782" class="panel" />
  <line x1="194" y1="78" x2="194" y2="860" class="divider" />
  <line x1="1124" y1="78" x2="1124" y2="860" class="divider" />

  <!-- Pages navigator -->
  <text x="16" y="104" class="ui label">Pages</text>
  <text x="159" y="104" class="ui tiny muted">12</text>
  <rect x="12" y="114" width="170" height="26" rx="3" fill="#26303a" />
  <path d="M24 127h9M28.5 122.5v9" class="icon" />
  <text x="42" y="130" class="ui small">Import pages</text>
  <line x1="12" y1="151" x2="182" y2="151" class="divider" />

  <!-- Page rows -->
  <g>
    <rect x="10" y="160" width="174" height="88" rx="3" fill="#2c3e52" stroke="#64a9ff" />
    <rect x="20" y="170" width="45" height="64" fill="#ece8df" />
    <path d="M24 192h37M24 215h37" stroke="#b9b1a4" />
    <path d="M28 177h29v12H28z" fill="#cbc4b9" />
    <text x="75" y="186" class="ui small">07  chapter-07</text>
    <text x="75" y="204" class="ui tiny muted">Cleaned · edited</text>
    <text x="75" y="222" class="ui tiny accent">Current page</text>
  </g>
  <g>
    <rect x="10" y="256" width="174" height="78" rx="3" fill="#20252a" />
    <rect x="20" y="266" width="45" height="58" fill="#ece8df" />
    <path d="M24 286h37M24 305h37" stroke="#b9b1a4" />
    <text x="75" y="283" class="ui small">08  page-08</text>
    <text x="75" y="302" class="ui tiny muted">Translated</text>
  </g>
  <g>
    <rect x="10" y="342" width="174" height="78" rx="3" fill="#20252a" />
    <rect x="20" y="352" width="45" height="58" fill="#ece8df" />
    <path d="M24 372h37M24 391h37" stroke="#b9b1a4" />
    <text x="75" y="369" class="ui small">09  page-09</text>
    <text x="75" y="388" class="ui tiny muted">Needs review</text>
    <circle cx="170" cy="384" r="3" fill="#e3a85a" />
  </g>
  <g>
    <rect x="10" y="428" width="174" height="78" rx="3" fill="#20252a" />
    <rect x="20" y="438" width="45" height="58" fill="#ece8df" />
    <path d="M24 458h37M24 477h37" stroke="#b9b1a4" />
    <text x="75" y="455" class="ui small">10  page-10</text>
    <text x="75" y="474" class="ui tiny muted">Not processed</text>
  </g>

  <!-- Canvas -->
  <text x="217" y="104" class="ui tiny muted">PAGE 07  ·  LETTERED PREVIEW</text>
  <text x="1087" y="104" text-anchor="end" class="ui tiny muted">100%</text>
  <rect x="214" y="118" width="888" height="715" rx="2" fill="url(#checker)" />
  <rect x="425" y="139" width="485" height="675" fill="#f1eee7" filter="url(#pageShadow)" />
  <rect x="450" y="165" width="435" height="252" fill="#d5d0c5" />
  <path d="M450 402l94-104 92 50 77-96 172 165z" fill="#bab7b0" />
  <path d="M458 188h418M458 205h418" stroke="#a7a39a" stroke-width="3" />
  <rect x="450" y="438" width="204" height="321" fill="#dad6cd" />
  <rect x="672" y="438" width="213" height="151" fill="#d1ccc3" />
  <rect x="672" y="608" width="213" height="151" fill="#d9d4cb" />
  <path d="M463 450h177M463 464h150M685 451h177M685 466h160M685 621h177M685 636h154" stroke="#aaa59b" stroke-width="3" />
  <path d="M473 515c28-43 90-43 118 0-28 37-90 37-118 0z" fill="#faf8f2" stroke="#97938b" stroke-width="2" />
  <text x="532" y="517" text-anchor="middle" class="ui" fill="#4b4e51" font-size="16">翻訳テキスト</text>
  <rect x="468" y="535" width="166" height="31" fill="none" stroke="#64a9ff" stroke-width="2" stroke-dasharray="5 4" />
  <circle cx="468" cy="535" r="4" fill="#64a9ff" />
  <circle cx="634" cy="566" r="4" fill="#64a9ff" />
  <text x="468" y="584" class="ui tiny" fill="#64a9ff">Text 01</text>

  <!-- Canvas tool rail -->
  <rect x="226" y="145" width="34" height="240" rx="4" fill="#20252a" stroke="#3b444d" />
  <rect x="231" y="151" width="24" height="24" rx="3" fill="#2c3e52" stroke="#64a9ff" />
  <path d="M239 157l8 7-4 1 3 6-2 1-3-6-3 3z" fill="#64a9ff" />
  <path d="M238 187h10v10h-10z" class="icon" />
  <path d="M237 218c8-11 15 2 8 9-8 8-15-5-8-9z" class="icon" />
  <path d="M237 245l15 0M244 238v15" class="icon" />
  <path d="M238 273c0-6 11-6 11 0v10h-11z" class="icon" />
  <path d="M238 305h11M243.5 299v12" class="icon" />
  <path d="M238 334h11M238 345h11" class="icon" />

  <!-- Properties panel -->
  <rect x="1124" y="78" width="316" height="246" fill="#1b1f23" />
  <text x="1142" y="104" class="ui label">Properties</text>
  <text x="1420" y="104" text-anchor="end" class="ui tiny muted">Text 01</text>
  <line x1="1138" y1="116" x2="1426" y2="116" class="divider" />
  <text x="1142" y="139" class="ui tiny muted">TRANSLATION</text>
  <rect x="1140" y="148" width="288" height="43" rx="3" fill="#15181b" stroke="#3b444d" />
  <text x="1152" y="174" class="ui small">Translation text</text>
  <text x="1142" y="215" class="ui tiny muted">TYPOGRAPHY</text>
  <rect x="1140" y="225" width="112" height="24" rx="3" fill="#15181b" stroke="#3b444d" />
  <text x="1152" y="241" class="ui small">Komika</text>
  <rect x="1260" y="225" width="60" height="24" rx="3" fill="#15181b" stroke="#3b444d" />
  <text x="1276" y="241" class="ui small">28 px</text>
  <rect x="1328" y="225" width="100" height="24" rx="3" fill="#15181b" stroke="#3b444d" />
  <text x="1342" y="241" class="ui small">Centered</text>
  <text x="1142" y="281" class="ui tiny muted">OPACITY</text>
  <rect x="1140" y="289" width="232" height="6" rx="3" fill="#3b444d" />
  <rect x="1140" y="289" width="232" height="6" rx="3" fill="#64a9ff" />
  <circle cx="1372" cy="292" r="7" fill="#64a9ff" />
  <text x="1390" y="297" class="ui small">100%</text>

  <!-- Layers panel -->
  <rect x="1124" y="324" width="316" height="536" fill="#1b1f23" />
  <text x="1142" y="350" class="ui label">Layers</text>
  <text x="1420" y="350" text-anchor="end" class="ui tiny muted">⌕  Filter</text>
  <line x1="1138" y1="362" x2="1426" y2="362" class="divider" />

  <!-- Layer rows -->
  <g>
    <path d="M1146 386l4 4 4-4" class="icon" />
    <circle cx="1177" cy="387" r="8" fill="#787d82" />
    <text x="1192" y="391" class="ui small">Translation</text>
    <text x="1418" y="391" text-anchor="end" class="ui tiny muted">▣</text>
  </g>
  <g>
    <path d="M1164 412l4 4 4-4" class="icon" />
    <circle cx="1195" cy="413" r="7" fill="#f0eee8" stroke="#6a727a" />
    <text x="1210" y="417" class="ui small">Text 01</text>
    <text x="1418" y="417" text-anchor="end" class="ui tiny muted">T</text>
  </g>
  <g>
    <rect x="1138" y="427" width="288" height="30" rx="3" fill="#2c3e52" stroke="#64a9ff" />
    <path d="M1164 442h8M1168 438v8" class="icon" />
    <circle cx="1195" cy="442" r="7" fill="#f0eee8" stroke="#64a9ff" />
    <text x="1210" y="446" class="ui small">Text 02</text>
    <text x="1418" y="446" text-anchor="end" class="ui tiny accent">T</text>
  </g>
  <g>
    <path d="M1146 478l4 4 4-4" class="icon" />
    <circle cx="1177" cy="479" r="8" fill="#6e767d" />
    <text x="1192" y="483" class="ui small">Paint</text>
  </g>
  <g>
    <circle cx="1177" cy="510" r="8" fill="#242a2f" stroke="#7d8790" />
    <text x="1192" y="514" class="ui small">Paint layer 1</text>
