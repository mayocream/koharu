  <text x="1228" y="885" class="ui tiny muted">Zoom</text>
  <rect x="1274" y="878" width="100" height="6" rx="3" fill="#3b444d" />
  <rect x="1274" y="878" width="64" height="6" rx="3" fill="#64a9ff" />
  <circle cx="1338" cy="881" r="6" fill="#64a9ff" />
