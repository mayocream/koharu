    <text x="1192" y="546" class="ui small">Cleanup</text>
    <text x="1418" y="546" text-anchor="end" class="ui tiny muted">▧</text>
  </g>
  <g>
    <rect x="1138" y="558" width="288" height="30" rx="3" fill="#252a2f" />
    <path d="M1155 573h11M1160.5 568v10" class="icon" />
    <circle cx="1177" cy="573" r="8" fill="#ece8df" stroke="#7d8790" />
    <text x="1192" y="577" class="ui small">Original artwork</text>
    <text x="1418" y="577" text-anchor="end" class="ui tiny muted">▣  🔒</text>
  </g>
  <line x1="1138" y1="612" x2="1426" y2="612" class="divider" />
  <text x="1142" y="638" class="ui tiny muted">+  New layer</text>
  <text x="1228" y="638" class="ui tiny muted">▣  Group</text>
  <text x="1301" y="638" class="ui tiny muted">⌫  Delete</text>

  <!-- Status bar -->
